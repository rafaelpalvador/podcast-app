<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ondas — Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0;background:#0F1115}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0F1115; font-family: Inter, sans-serif; color: #F2F3F5">
<dc-import name="App" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B544","options":["#F5B544","#4FB3BF","#B48EE0","#7BC47F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#F5B544' }; }
}
</script>
</body>
</html>
