name: Compilar apps (Windows, Linux e Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['design/**', 'assets/**', '**.md']

permissions:
  contents: write

jobs:
  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Número da versão (0.1.N, sobe a cada compilação)
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,1))"
          sed -i "s|/\*BUILD\*/{v:'dev',d:'',c:''}|{v:'0.1.${{ github.run_number }}',d:'$(date -u +%Y-%m-%dT%H:%M:%SZ)',c:'${GITHUB_SHA::7}'}|" src/index.html
      - name: Instalar dependências
        run: npm install
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Compilar
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Podcast-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux (AppImage, .deb, .rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Bibliotecas do sistema (WebKitGTK e GStreamer para o áudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Número da versão (0.1.N, sobe a cada compilação)
        run: |
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,1))"
          sed -i "s|/\*BUILD\*/{v:'dev',d:'',c:''}|{v:'0.1.${{ github.run_number }}',d:'$(date -u +%Y-%m-%dT%H:%M:%SZ)',c:'${GITHUB_SHA::7}'}|" src/index.html
      - name: Instalar dependências
        run: npm install
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Compilar
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npx tauri build --bundles appimage,deb,rpm
      - name: Pacote simples (.tar.gz) para Arch/CachyOS e outras
        run: |
          D=Podcast-Linux
          mkdir -p "$D"
          cp src-tauri/target/release/podcast-app "$D/podcast"
          cp src-tauri/icons/128x128@2x.png "$D/podcast.png"
          cat > "$D/podcast.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Podcast
          Comment=App de podcast pessoal
          Exec=podcast
          Icon=app.rafael.podcast
          Terminal=false
          Categories=AudioVideo;Audio;Player;
          StartupWMClass=podcast
          EOF
          cat > "$D/instalar.sh" <<'EOF'
          #!/usr/bin/env bash
          # Instala o Podcast só para o seu usuário (sem sudo): ~/.local
          set -e
          cd "$(dirname "$0")"
          mkdir -p ~/.local/bin ~/.local/share/applications ~/.local/share/icons/hicolor/256x256/apps
          install -m755 podcast ~/.local/bin/podcast
          install -m644 podcast.png ~/.local/share/icons/hicolor/256x256/apps/app.rafael.podcast.png
          sed "s|^Exec=.*|Exec=$HOME/.local/bin/podcast|" podcast.desktop > ~/.local/share/applications/app.rafael.podcast.desktop
          update-desktop-database ~/.local/share/applications 2>/dev/null || true
          echo "Pronto: procure Podcast no menu de aplicativos."
          echo "Para tocar áudio, o sistema precisa do GStreamer (no CachyOS/Arch: sudo pacman -S --needed webkit2gtk-4.1 gst-plugins-good gst-plugins-bad gst-libav)."
          EOF
          cat > "$D/desinstalar.sh" <<'EOF'
          #!/usr/bin/env bash
          rm -f ~/.local/bin/podcast ~/.local/share/applications/app.rafael.podcast.desktop ~/.local/share/icons/hicolor/256x256/apps/app.rafael.podcast.png
          echo "Podcast removido (seus dados ficam em ~/.local/share/app.rafael.podcast)."
          EOF
          chmod +x "$D"/*.sh "$D/podcast"
          tar czf Podcast-Linux.tar.gz "$D"
          ls -la src-tauri/target/release/bundle/*/
      - uses: actions/upload-artifact@v4
        with:
          name: Podcast-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            Podcast-Linux.tar.gz
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar SDK e NDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Número da versão (0.1.N, sobe a cada compilação)
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,1))"
          sed -i "s|/\*BUILD\*/{v:'dev',d:'',c:''}|{v:'0.1.${{ github.run_number }}',d:'$(date -u +%Y-%m-%dT%H:%M:%SZ)',c:'${GITHUB_SHA::7}'}|" src/index.html
      - name: Instalar dependências
        run: npm install
      - name: Gerar projeto Android
        run: npx tauri android init --ci
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Código nativo (player de mídia, widgets e atalhos)
        run: bash scripts/android-nativo.sh
      - name: Compilar APK (tenta de novo se a rede falhar)
        run: |
          P=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          [ -f "$P" ] && (grep -q networkTimeout "$P" && sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$P" || echo "networkTimeout=120000" >> "$P")
          for i in 1 2 3; do
            npx tauri android build --apk --target aarch64 --target armv7 && exit 0
            echo "Tentativa $i falhou; esperando 30 s"; sleep 30
          done
          exit 1
      - name: Assinar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK: $IN"
          "$BT/zipalign" -p -f 4 "$IN" alinhado.apk
          "$BT/apksigner" sign --ks android-assinatura/podcast-pessoal.jks --ks-key-alias podcast --ks-pass pass:podcast-pessoal --key-pass pass:podcast-pessoal --out Podcast-Android.apk alinhado.apk
          "$BT/apksigner" verify Podcast-Android.apk && ls -la Podcast-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Podcast-Android
          path: Podcast-Android.apk
          if-no-files-found: error

  testes:
    name: Testes do leitor de feeds (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Testar com feeds reais
        run: |
          mkdir -p /tmp/ft/src && cd /tmp/ft
          cat > Cargo.toml <<'EOF'
          [package]
          name = "ft"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          quick-xml = "0.37"
          html-escape = "0.2"
          serde = { version = "1", features = ["derive"] }
          EOF
          cp "$GITHUB_WORKSPACE/src-tauri/src/feed.rs" src/feed.rs
          cat > src/main.rs <<'EOF'
          #[allow(dead_code)]
          mod feed;
          fn main() {
              let mut ok = 0;
              for p in std::env::args().skip(1) {
                  let b = std::fs::read(&p).unwrap();
                  if b.len() < 200 || !String::from_utf8_lossy(&b[..b.len().min(3000)]).contains("<rss") { println!("{} pulado (não é RSS)", p); continue; }
                  let t = std::time::Instant::now();
                  match feed::parse(&b, 200) {
                      Ok(f) => {
                          let i = f.items.first();
                          println!("{} KB -> '{}' | {} episódios em {:?}\n   1º: {:?} | {:?} | dur {:?}\n   desc: {}", b.len() / 1024, f.title, f.items.len(), t.elapsed(),
                              i.map(|x| &x.title), i.map(|x| &x.url), i.map(|x| &x.dur), i.map(|x| x.desc.chars().take(100).collect::<String>()).unwrap_or_default());
                          assert!(!f.items.is_empty() && !f.title.is_empty());
                          ok += 1;
                      }
                      Err(e) => { println!("{}: ERRO {}", p, e); std::process::exit(1); }
                  }
              }
              println!("{} feeds lidos", ok);
          }
          EOF
          cargo test --quiet
          i=0
          for u in https://feeds.npr.org/510289/podcast.xml https://feeds.simplecast.com/54nAGcIl https://lexfridman.com/feed/podcast/ https://feeds.megaphone.fm/stuffyoushouldknow https://anchor.fm/s/1b8a1e8c/podcast/rss https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/A91018A4-EA4F-4130-BF55-AE270180C327/44710ECC-10BB-48D1-93C7-AE270180C33E/podcast.rss; do
            i=$((i+1)); curl -sL --max-time 40 -A "PodcastApp/0.1" -o "f$i.xml" "$u" || true
          done
          cargo run --quiet --release -- f*.xml

  publicar:
    name: Publicar em Releases
    needs: [windows, linux, android, testes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
      - name: Organizar arquivos
        run: |
          mkdir -p saida
          find arquivos -name "*.apk" | head -1 | xargs -I{} cp {} "saida/Podcast-Android.apk"
          find arquivos -name "*-setup.exe" | head -1 | xargs -I{} cp {} "saida/Podcast-Windows-instalador.exe"
          find arquivos -name "*.AppImage" | head -1 | xargs -I{} cp {} "saida/Podcast-Linux.AppImage"
          find arquivos -name "*.deb" | head -1 | xargs -I{} cp {} "saida/Podcast-Linux.deb"
          find arquivos -name "*.rpm" | head -1 | xargs -I{} cp {} "saida/Podcast-Linux.rpm"
          find arquivos -name "Podcast-Linux.tar.gz" | head -1 | xargs -I{} cp {} "saida/Podcast-Linux.tar.gz"
          sed -i "s/\"Version\": \"1.0\"/\"Version\": \"0.1.${{ github.run_number }}\"/" linux-widget/metadata.json
          (cd linux-widget && zip -qr "../saida/Podcast-Linux-widget.plasmoid" .)
          ls -la saida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Podcast 0.1.${{ github.run_number }}
          body: |
            Versão 0.1.${{ github.run_number }} (commit ${{ github.sha }}).
            - **Android:** `Podcast-Android.apk` — no Obtainium, use o endereço do repositório para receber as atualizações sozinho.
            - **Windows:** `Podcast-Windows-instalador.exe`.
            - **Linux:** `Podcast-Linux.AppImage` (roda em qualquer distro), `.deb`, `.rpm` ou `Podcast-Linux.tar.gz` (Arch/CachyOS, instala com `bash instalar.sh`).
            - **Linux (widget do KDE Plasma 6):** `Podcast-Linux-widget.plasmoid` — widget com o mesmo visual, sincronizado pelo GitHub.
            Links fixos (sempre a versão mais nova):
            - https://github.com/${{ github.repository }}/releases/latest/download/Podcast-Android.apk
            - https://github.com/${{ github.repository }}/releases/latest/download/Podcast-Windows-instalador.exe
            - https://github.com/${{ github.repository }}/releases/latest/download/Podcast-Linux.AppImage
            - https://github.com/${{ github.repository }}/releases/latest/download/Podcast-Linux.tar.gz
            - https://github.com/${{ github.repository }}/releases/latest/download/Podcast-Linux-widget.plasmoid
          prerelease: false
          make_latest: true
          files: saida/*
      - name: Apagar versões antigas (fica só a mais nova)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=v0.1.${{ github.run_number }}
          gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' | while read -r T; do
            if [[ "$T" == v* ]] && [ "$T" != "$KEEP" ]; then echo "apagando $T"; gh release delete "$T" --repo ${{ github.repository }} --cleanup-tag -y || true; fi
          done
